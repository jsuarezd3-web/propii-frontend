<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propii — Registro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a1628; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    .logo { margin-bottom: 2rem; }
    .logo img { height: 90px; }
    .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 440px; }
    .card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.4rem; }
    .card p { color: rgba(255,255,255,0.5); font-size: 0.9rem; margin-bottom: 2rem; }
    .input-group { margin-bottom: 1rem; }
    .input-group label { display: block; font-size: 0.85rem; color: rgba(255,255,255,0.6); margin-bottom: 0.4rem; }
    .input-group input, .input-group select { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; padding: 0.75rem 1rem; color: #fff; font-size: 0.95rem; outline: none; }
    .input-group select option { background: #0d2444; }
    .input-group input:focus, .input-group select:focus { border-color: #2B7BC4; }
    .btn-register { width: 100%; background: #F7931E; color: #fff; border: none; padding: 0.85rem; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
    .btn-register:disabled { opacity: 0.6; cursor: not-allowed; }
    .footer-link { text-align: center; margin-top: 1.2rem; font-size: 0.85rem; color: rgba(255,255,255,0.4); }
    .footer-link a { color: #F7931E; text-decoration: none; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }

    /* QR SUCCESS */
    .success { display: none; text-align: center; }
    .success h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    .success p { color: rgba(255,255,255,0.6); margin-bottom: 1.5rem; font-size: 0.95rem; }
    #qrcode { display: flex; justify-content: center; margin: 1.5rem 0; }
    #qrcode canvas { border-radius: 12px; padding: 12px; background: #fff; }
    .qr-url { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.8rem; color: rgba(255,255,255,0.5); word-break: break-all; margin-bottom: 1.5rem; }
    .btn-dashboard { display: block; background: #2B7BC4; color: #fff; padding: 0.85rem; border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none; text-align: center; }
  </style>
</head>
<body>

<div class="logo"><a href="index.html"><img src="logo.png" alt="Propii"></a></div>

<div class="card" id="form-card">
  <h2>Crea tu cuenta</h2>
  <p>Gratis. Tu QR listo en segundos.</p>

<div class="input-group">
    <label>Nombre(s)</label>
    <input type="text" id="first_name" placeholder="Ej. Juan Carlos">
</div>
<div class="input-group">
    <label>Apellido(s)</label>
    <input type="text" id="last_name" placeholder="Ej. García López">
</div>
  <div class="input-group">
    <label>Correo electrónico</label>
    <input type="email" id="email" placeholder="tu@correo.com">
  </div>
  <div class="input-group">
    <label>Teléfono</label>
    <input type="tel" id="phone" placeholder="+52 81 1234 5678">
  </div>
<div class="input-group">
    <label>Fecha de nacimiento</label>
    <input type="date" id="fecha_nacimiento">
</div>
<div class="input-group">
    <label>Calle</label>
    <input type="text" id="calle" placeholder="Ej. Av. Constitución">
</div>
<div class="input-group">
    <label>Número exterior</label>
    <input type="text" id="numero_exterior" placeholder="Ej. 123">
</div>
<div class="input-group">
    <label>Colonia</label>
    <input type="text" id="colonia" placeholder="Ej. Centro">
</div>
<div class="input-group">
    <label>Ciudad</label>
    <input type="text" id="ciudad" placeholder="Ej. Monterrey">
</div>
<div class="input-group">
    <label>Código postal</label>
    <input type="text" id="codigo_postal" placeholder="Ej. 64000">
</div>
<div class="input-group">
    <label>CLABE interbancaria</label>
    <input type="text" id="clabe" placeholder="18 dígitos">
</div>
<div class="input-group">
    <label>RFC</label>
    <input type="text" id="rfc" placeholder="Ej. GALO900101ABC">
</div>
  <div class="input-group">
    <label>¿Qué eres?</label>
    <select id="role">
      <option value="">Selecciona tu rol</option>
      <option value="Empacador">Empacador</option>
      <option value="Mesero">Mesero</option>
      <option value="Gasolinero">Gasolinero</option>
      <option value="Valet parking">Valet parking</option>
      <option value="Estilista">Estilista</option>
      <option value="Entrenador">Entrenador</option>
      <option value="Hotelería">Hotelería</option>
      <option value="Otro">Otro</option>
    </select>
  </div>
  <div class="input-group">
    <label>Lugar de trabajo</label>
    <input type="text" id="hotel_or_place" placeholder="Ej. HEB Cumbres, Hotel Fiesta">
  </div>
  <div class="input-group">
      <label>Mensaje de agradecimiento para tus clientes</label>
      <input type="text" id="mensaje_agradecimiento" placeholder="Ej. ¡Gracias! Me ayuda a pagar mis estudios 🙏" maxlength="150">
      <div style="font-size:0.75rem; color:rgba(255,255,255,0.4); margin-top:0.3rem;">Tus clientes verán este mensaje después de dejarte propina.</div>
  </div>

  <div class="input-group">
    <label>Contraseña</label>
    <input type="password" id="password" placeholder="Mínimo 6 caracteres">
  </div>

  <button class="btn-register" id="btn-register" onclick="registrar()">Crear cuenta y obtener QR</button>
  <div class="error" id="error-msg"></div>
  <div class="footer-link">¿Ya tienes cuenta? <a href="index.html">Iniciar sesión</a></div>
</div>

<div class="card success" id="success-card">
  <h2>¡Bienvenido a Propii! 🎉</h2>
  <p>Este es tu QR personal. Muéstralo o imprímelo para recibir propinas.</p>
  <div id="qrcode"></div>
  <div class="qr-url" id="qr-url-text"></div>
  <button onclick="guardarQR()" class="btn-dashboard" style="background:#F7931E; margin-bottom:0.8rem;">Guardar imagen del QR</button>
  <a href="dashboard.html" class="btn-dashboard">Ver mi dashboard</a>
</div>



<script>
function validarCLABE(clabe) {
    if (clabe.length !== 18) return 'La CLABE debe tener exactamente 18 dígitos.';
    if (!/^\d{18}$/.test(clabe)) return 'La CLABE solo debe contener números.';
    const factores = [3, 7, 1];
    let suma = 0;
    for (let i = 0; i < 17; i++) {
        suma += (parseInt(clabe[i]) * factores[i % 3]) % 10;
    }
    const digitoVerificador = (10 - (suma % 10)) % 10;
    if (digitoVerificador !== parseInt(clabe[17])) return 'La CLABE no es válida, verifica que esté correcta.';
    return null;

}

function validarRFC(rfc) {
    if (!rfc) return null;
    const regex = /^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/i;
    if (!regex.test(rfc)) return 'El RFC no tiene un formato válido. Ejemplo: GALO900101ABC';
    return null;
}

function validarTelefono(tel) {
    const limpio = tel.replace(/[\s\+\-\(\)]/g, '');
    if (!/^\d{10,12}$/.test(limpio)) return 'El teléfono debe tener entre 10 y 12 dígitos numéricos.';
    return null;
}

function validarCP(cp) {
    if (!/^\d{5}$/.test(cp)) return 'El código postal debe tener exactamente 5 dígitos.';
    return null;
}

  async function registrar() {
const first_name = document.getElementById('first_name').value.trim();
const last_name = document.getElementById('last_name').value.trim();
const full_name = `${first_name} ${last_name}`.trim();
const email = document.getElementById('email').value.trim();
const phone = document.getElementById('phone').value.trim();
const role = document.getElementById('role').value;
const hotel_or_place = document.getElementById('hotel_or_place').value.trim();
const password = document.getElementById('password').value;
const fecha_nacimiento = document.getElementById('fecha_nacimiento').value;
const calle = document.getElementById('calle').value.trim();
const numero_exterior = document.getElementById('numero_exterior').value.trim();
const colonia = document.getElementById('colonia').value.trim();
const ciudad = document.getElementById('ciudad').value.trim();
const codigo_postal = document.getElementById('codigo_postal').value.trim();
const clabe = document.getElementById('clabe').value.replace(/\s/g, '');
const rfc = document.getElementById('rfc').value.trim();
const mensaje_agradecimiento = document.getElementById('mensaje_agradecimiento').value.trim();

    if (!first_name || !last_name || !email || !phone || !role || !hotel_or_place || !password || !fecha_nacimiento || !calle || !colonia || !ciudad || !codigo_postal) {
      document.getElementById('error-msg').textContent = 'Por favor llena todos los campos.';
      return;
    }
    if (password.length < 6) {
      document.getElementById('error-msg').textContent = 'La contraseña debe tener al menos 6 caracteres.';
      return;
    }

      if (clabe) {
      const errorClabe = validarCLABE(clabe);
      if (errorClabe) {
          document.getElementById('error-msg').textContent = errorClabe;
      return;
      }

      const errorRFC = validarRFC(rfc);
      if (errorRFC) { document.getElementById('error-msg').textContent = errorRFC; return; }

      const errorTel = validarTelefono(phone);
      if (errorTel) { document.getElementById('error-msg').textContent = errorTel; return; }

      const errorCP = validarCP(codigo_postal);
      if (errorCP) { document.getElementById('error-msg').textContent = errorCP; return; }

}

    const btn = document.getElementById('btn-register');
    btn.disabled = true;
    btn.textContent = 'Creando cuenta...';
    document.getElementById('error-msg').textContent = '';

    try {
      const res = await fetch('https://propii-production.up.railway.app/workers/onboard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name, first_name, last_name, email, role, hotel_or_place, phone, fecha_nacimiento, numero_exterior, calle, colonia, ciudad, codigo_postal, clabe, rfc, mensaje_agradecimiento })
      });
      const data = await res.json();
      if (!res.ok) {
        document.getElementById('error-msg').textContent = data.detail || 'Error al crear la cuenta.';
        btn.disabled = false;
        btn.textContent = 'Crear cuenta y obtener QR';
        return;
      }

      const workerId = data.worker_id;

      await fetch('https://propii-production.up.railway.app/workers/set-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      if (data.onboarding_url) {
        window.location.href = data.onboarding_url;
      } else {
        const pagoUrl = `https://www.propii.mx/pago.html?id=${workerId}`;
        document.getElementById('qr-url-text').textContent = pagoUrl;
        const qrDiv = document.getElementById('qrcode');
        qrDiv.style.background = '#ffffff';
        qrDiv.style.padding = '16px';
        qrDiv.style.borderRadius = '12px';
        qrDiv.style.display = 'inline-block';
        new QRCode(qrDiv, { text: pagoUrl, width: 200, height: 200, colorDark: '#0a1628', colorLight: '#ffffff' });
        document.getElementById('form-card').style.display = 'none';
        document.getElementById('success-card').style.display = 'block';
      }

    } catch (e) {
      document.getElementById('error-msg').textContent = 'Error de conexión. Intenta de nuevo.';
      btn.disabled = false;
      btn.textContent = 'Crear cuenta y obtener QR';
    }
  }

  function guardarQR() {
    const qrCanvas = document.querySelector('#qrcode canvas');
    const nombre = document.getElementById('full_name').value.trim();
    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 620;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.roundRect(0, 0, 400, 620, 20);
    ctx.fill();
    const logo = new Image();
    logo.src = 'logo.png';
    logo.onload = function() {
      const ratio = logo.width / logo.height;
      const logoH = 140;
      const logoW = logoH * ratio;
      ctx.drawImage(logo, (400 - logoW) / 2, 20, logoW, logoH);
      ctx.drawImage(qrCanvas, 75, 170, 250, 250);
      ctx.fillStyle = '#0a1628';
      ctx.font = 'bold 22px Inter, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('¡Escanéame!', 200, 460);
      ctx.fillStyle = '#2B7BC4';
      ctx.font = 'bold 22px Inter, Arial';
      ctx.fillText('Déjame una propina digital', 200, 495);
      ctx.fillStyle = '#555';
      ctx.font = 'bold 16px Inter, Arial';
      ctx.fillText(nombre, 200, 530);
      ctx.fillStyle = '#F7931E';
      ctx.font = 'bold 14px Inter, Arial';
      ctx.fillText('propii.mx', 200, 560);
      const link = document.createElement('a');
      link.download = 'mi-qr-propii.png';
      link.href = canvas.toDataURL();
      link.click();
    };
  }
</script>
</body>
</html>
