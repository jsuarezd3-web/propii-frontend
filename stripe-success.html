<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Propii — ¡Cuenta lista!</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', -apple-system, sans-serif; background: #0a1628; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; }
    .logo img { height: 80px; margin-bottom: 2rem; }
    h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.8rem; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 1.5rem; font-size: 1rem; line-height: 1.6; }
    #qrcode { display: flex; justify-content: center; margin: 1.5rem 0; }
    #qrcode canvas { border-radius: 12px; padding: 12px; background: #fff; }
    .qr-url { background: rgba(255,255,255,0.07); border-radius: 10px; padding: 0.75rem 1rem; font-size: 0.8rem; color: rgba(255,255,255,0.5); word-break: break-all; margin-bottom: 1.5rem; max-width: 400px; }
    .btns { display: flex; flex-direction: column; gap: 0.8rem; max-width: 400px; width: 100%; }
    .btn-orange { background: #F7931E; color: #fff; padding: 0.85rem; border-radius: 12px; font-size: 1rem; font-weight: 600; border: none; cursor: pointer; }
    .btn-blue { background: #2B7BC4; color: #fff; padding: 0.85rem; border-radius: 12px; font-size: 1rem; font-weight: 600; text-decoration: none; display: block; }
  </style>
</head>
<body>
  <div class="logo"><img src="logo.png" alt="Propii"></div>
  <h1>🎉 ¡Tu cuenta está lista!</h1>
  <p>Este es tu QR personal. Muéstralo o imprímelo para recibir propinas.</p>
  <div id="qrcode"></div>
  <div class="qr-url" id="qr-url-text"></div>
  <div class="btns">
    <button class="btn-orange" onclick="guardarQR()">Guardar imagen del QR</button>
    <a href="index.html" class="btn-blue">Ver mi dashboard</a>
  </div>

<script>
  const params = new URLSearchParams(window.location.search);
  const workerId = params.get('id');
  let workerName = '';

  if (workerId) {
    const pagoUrl = `https://www.propii.mx/pago.html?id=${workerId}`;
    document.getElementById('qr-url-text').textContent = pagoUrl;

    const qrDiv = document.getElementById('qrcode');
    new QRCode(qrDiv, {
      text: pagoUrl,
      width: 200,
      height: 200,
      colorDark: '#0a1628',
      colorLight: '#ffffff'
    });

    fetch(`https://propii-production.up.railway.app/workers/${workerId}`)
      .then(r => r.json())
      .then(w => { workerName = w.full_name; });
  }

  function guardarQR() {
    const qrCanvas = document.querySelector('#qrcode canvas');
    const canvas = document.createElement('canvas');
    canvas.width = 400;
    canvas.height = 620;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.roundRect(0, 0, 400, 620, 20);
    ctx.fill();
    const logo = new Image();
    logo.src = 'logo.png';
    logo.onload = function() {
      const ratio = logo.width / logo.height;
      const logoH = 140;
      const logoW = logoH * ratio;
      ctx.drawImage(logo, (400 - logoW) / 2, 20, logoW, logoH);
      ctx.drawImage(qrCanvas, 75, 170, 250, 250);
      ctx.fillStyle = '#0a1628';
      ctx.font = 'bold 22px Inter, Arial';
      ctx.textAlign = 'center';
      ctx.fillText('¡Escanéame!', 200, 460);
      ctx.fillStyle = '#2B7BC4';
      ctx.font = 'bold 22px Inter, Arial';
      ctx.fillText('Déjame una propina digital', 200, 495);
      ctx.fillStyle = '#555';
      ctx.font = 'bold 16px Inter, Arial';
      ctx.fillText(workerName, 200, 530);
      ctx.fillStyle = '#F7931E';
      ctx.font = 'bold 14px Inter, Arial';
      ctx.fillText('propii.mx', 200, 560);
      const link = document.createElement('a');
      link.download = 'mi-qr-propii.png';
      link.href = canvas.toDataURL();
      link.click();
    };
  }
</script>
</body>
</html>
